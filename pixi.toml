[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[feature.server.dependencies]
python = "3.11.*"
numpy = ">=1.24,<2"
scipy = ">=1.10"
matplotlib = ">=3.7"
r-base = ">=4.2"
r-survival = "*"
r-mvtnorm = "*"
r-modeltools = "*"
r-coin = "*"
r-mass = "*"
r-matrix = "*"
rpy2 = ">=3.5"
biom-format = ">=2.1.12"

[feature.server.pypi-dependencies]
fastmcp = { version = "==4.0.3" }
pytest = ">=7"
pytest-asyncio = ">=0.23"

[environments]
server = { features = ["server"], no-default-feature = true }